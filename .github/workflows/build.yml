name: Build APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: gradle assembleRelease --stacktrace
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdirneHavaDurumu-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2}' app/build.gradle)
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk#EdirneHavaDurumu.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release/app-release.apk#EdirneHavaDurumu.apk --title "Edirne Hava Durumu ${VERSION_NAME}" --notes "EDİRNE YEREL HAVA TAHMİN UYGULAMASI"
          fi
      - name: Update website version data
        run: |
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2}' app/build.gradle)
          VERSION_CODE=$(awk '/versionCode/{print $2}' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk docs/EdirneHavaDurumu.apk
          UPLOAD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{"versionCode":%s,"versionName":"%s","uploadDate":"%s","notes":"Yeni APK yayinlandi.","apkUrl":"https://github.com/hkndmrl22-bit/Edirnehavadurumu2/releases/latest/download/app-release.apk"}\n' "$VERSION_CODE" "$VERSION_NAME" "$UPLOAD_DATE" > docs/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EdirneHavaDurumu.apk docs/version.json
          git diff --cached --quiet || git commit -m "Site surum bilgisini guncelle [skip ci]"
          git push
