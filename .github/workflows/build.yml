name: Build APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore adaptive icon
        run: |
          set -e
          mkdir -p app/src/main/res/drawable-xxxhdpi app/src/main/res/drawable-nodpi
          base64 -d build/icon/edirne_launcher_foreground.webp.b64 > app/src/main/res/drawable-xxxhdpi/edirne_launcher_foreground.webp
          # Remove the baked-in circular halo outside the sunburst. The adaptive
          # icon background is already solid black; this lets that background fill
          # Samsung's rounded-square mask instead of leaving a smaller black circle.
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageChops
          import math
          p = "app/src/main/res/drawable-xxxhdpi/edirne_launcher_foreground.webp"
          im = Image.open(p).convert("RGBA")
          w, h = im.size
          scale = 4
          cx, cy = w / 2, h / 2
          outer = min(w, h) * 0.345
          inner = min(w, h) * 0.255
          pts = []
          for i in range(32):
              a = -math.pi / 2 + i * math.pi / 16
              r = outer if i % 2 == 0 else inner
              pts.append(((cx + math.cos(a) * r) * scale, (cy + math.sin(a) * r) * scale))
          mask_big = Image.new("L", (w * scale, h * scale), 0)
          ImageDraw.Draw(mask_big).polygon(pts, fill=255)
          mask = mask_big.resize((w, h), Image.Resampling.LANCZOS)
          im.putalpha(ImageChops.multiply(im.getchannel("A"), mask))
          im.save(p, "WEBP", lossless=True, quality=100)
          PY
          cp app/src/main/res/drawable-xxxhdpi/edirne_launcher_foreground.webp app/src/main/res/drawable-nodpi/edirne_launcher_foreground_legacy.webp
          file app/src/main/res/drawable-xxxhdpi/edirne_launcher_foreground.webp
          test -s app/src/main/res/drawable-xxxhdpi/edirne_launcher_foreground.webp
          test -s app/src/main/res/drawable-nodpi/edirne_launcher_foreground_legacy.webp
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: gradle assembleRelease --stacktrace
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdirneHavaDurumu-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2}' app/build.gradle)
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk#EdirneHavaDurumu.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release/app-release.apk#EdirneHavaDurumu.apk --title "Edirne Hava Durumu $VERSION_NAME" --notes "EDİRNE YEREL HAVA TAHMİN UYGULAMASI"
          fi
      - name: Update website version data
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2}' app/build.gradle)
          VERSION_CODE=$(awk '/versionCode/{print $2}' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk docs/EdirneHavaDurumu.apk
          UPLOAD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{"versionCode":%s,"versionName":"%s","uploadDate":"%s","notes":"Yeni APK yayinlandi.","apkUrl":"https://github.com/hkndmrl22-bit/Edirnehavadurumu2/releases/latest/download/app-release.apk"}\n' "$VERSION_CODE" "$VERSION_NAME" "$UPLOAD_DATE" > docs/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EdirneHavaDurumu.apk docs/version.json
          git diff --cached --quiet || git commit -m "Site surum bilgisini guncelle [skip ci]"
          git push
