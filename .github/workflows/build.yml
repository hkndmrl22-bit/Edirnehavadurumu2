name: Build APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Restore adaptive icon
        run: |
          set -e
          mkdir -p app/src/main/res/drawable-xxxhdpi app/src/main/res/drawable-nodpi
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          from io import BytesIO
          import base64

          # Decode the known-good foreground asset from the repository.
          encoded = open("build/icon/edirne_launcher_foreground.webp.b64", "r").read().strip()
          src = Image.open(BytesIO(base64.b64decode(encoded))).convert("RGBA")

          # The old artwork was centered inside a large transparent margin.
          # Crop that margin, then scale the actual artwork to the full icon
          # canvas so the sunburst is not rendered as a small circle.
          bbox = src.getchannel("A").getbbox()
          if not bbox:
              raise RuntimeError("Launcher artwork has no visible pixels")
          src = src.crop(bbox).resize((512, 512), Image.Resampling.LANCZOS)

          # Turn the dark outer circular field into pure black outside the
          # central photo; the black adaptive background will blend into it.
          pixels = src.load()
          cx = cy = 255.5
          photo_radius = 181
          for y in range(512):
              for x in range(512):
                  r, g, b, a = pixels[x, y]
                  if a and (x - cx) ** 2 + (y - cy) ** 2 > photo_radius ** 2 and max(r, g, b) < 90:
                      pixels[x, y] = (0, 0, 0, a)

          # Keep the artwork's corners transparent; the adaptive icon's solid
          # black background supplies the rounded-square corners on Samsung.
          rounded = Image.new("L", (512, 512), 0)
          ImageDraw.Draw(rounded).rounded_rectangle((0, 0, 511, 511), radius=52, fill=255)
          src.putalpha(ImageChops.multiply(src.getchannel("A"), rounded)) if False else None
          alpha = src.getchannel("A")
          from PIL import ImageChops
          src.putalpha(ImageChops.multiply(alpha, rounded))

          out = "app/src/main/res/drawable-xxxhdpi/edirne_launcher_foreground.webp"
          src.save(out, "WEBP", lossless=True, quality=100)
          src.save("app/src/main/res/drawable-nodpi/edirne_launcher_foreground_legacy.webp", "WEBP", lossless=True, quality=100)
          print("Generated enlarged launcher artwork:", src.size, "visible bounds:", src.getchannel("A").getbbox())
          PY
          file app/src/main/res/drawable-xxxhdpi/edirne_launcher_foreground.webp
          test -s app/src/main/res/drawable-xxxhdpi/edirne_launcher_foreground.webp
          test -s app/src/main/res/drawable-nodpi/edirne_launcher_foreground_legacy.webp
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: gradle assembleRelease --stacktrace
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdirneHavaDurumu-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2}' app/build.gradle)
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk#EdirneHavaDurumu.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release/app-release.apk#EdirneHavaDurumu.apk --title "Edirne Hava Durumu $VERSION_NAME" --notes "EDİRNE YEREL HAVA TAHMİN UYGULAMASI"
          fi
      - name: Update website version data
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2}' app/build.gradle)
          VERSION_CODE=$(awk '/versionCode/{print $2}' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk docs/EdirneHavaDurumu.apk
          UPLOAD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{"versionCode":%s,"versionName":"%s","uploadDate":"%s","notes":"Yeni APK yayinlandi.","apkUrl":"https://github.com/hkndmrl22-bit/Edirnehavadurumu2/releases/latest/download/app-release.apk"}\n' "$VERSION_CODE" "$VERSION_NAME" "$UPLOAD_DATE" > docs/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EdirneHavaDurumu.apk docs/version.json
          git diff --cached --quiet || git commit -m "Site surum bilgisini guncelle [skip ci]"
          git push
