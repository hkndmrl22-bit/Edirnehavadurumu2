name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdirneHavaDurumu-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to site
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk docs/EdirneHavaDurumu.apk
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2}' app/build.gradle)
          VERSION_CODE=$(awk '/versionCode/{print $2}' app/build.gradle)
          printf '{"versionCode":%s,"versionName":"%s","notes":"Yeni sürüm yayınlandı.","apkUrl":"https://edirnehavadurumu.pages.dev/EdirneHavaDurumu.apk"}\n' "$VERSION_CODE" "$VERSION_NAME" > docs/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EdirneHavaDurumu.apk docs/version.json
          git diff --cached --quiet || git commit -m "Siteye güncel APK dosyasını yayınla"
          git pull --rebase origin main
          git push
