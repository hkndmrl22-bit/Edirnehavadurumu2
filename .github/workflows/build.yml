name: Build APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore adaptive icon
        run: |
          set -e
          mkdir -p app/src/main/res/drawable-xxxhdpi app/src/main/res/drawable-nodpi
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageDraw
          import math

          # Use the original square Edirne launcher artwork, not the smaller
          # circular foreground asset that caused the icon to look undersized.
          src = Image.open("app/src/main/res/drawable/edirne_launcher_512.jpg").convert("RGB")
          w, h = src.size
          if w != h:
              side = min(w, h)
              left = (w - side) // 2
              top = (h - side) // 2
              src = src.crop((left, top, left + side, top + side))
          # Remove the one-pixel pale edge present in the source JPEG.
          src = src.crop((2, 2, src.width - 2, src.height - 2)).resize((512, 512), Image.Resampling.LANCZOS)

          # Keep the photo and sunburst intact, while making the dark outer
          # field pure black. Do not darken the central photo.
          pixels = src.load()
          cx = cy = 255.5
          photo_radius = 181
          for y in range(512):
              for x in range(512):
                  r, g, b = pixels[x, y]
                  if (x - cx) ** 2 + (y - cy) ** 2 > photo_radius ** 2 and max(r, g, b) < 90:
                      pixels[x, y] = (0, 0, 0)

          # Make the source's outside corners transparent so the launcher's
          # own adaptive rounded-square mask and black background define the edge.
          rgba = src.convert("RGBA")
          mask = Image.new("L", (512, 512), 0)
          ImageDraw.Draw(mask).rounded_rectangle((0, 0, 511, 511), radius=52, fill=255)
          rgba.putalpha(mask)

          out = "app/src/main/res/drawable-xxxhdpi/edirne_launcher_foreground.webp"
          rgba.save(out, "WEBP", lossless=True, quality=100)
          rgba.save("app/src/main/res/drawable-nodpi/edirne_launcher_foreground_legacy.webp", "WEBP", lossless=True, quality=100)
          print("Generated full-size rounded-square launcher artwork:", rgba.size)
          PY
          file app/src/main/res/drawable-xxxhdpi/edirne_launcher_foreground.webp
          test -s app/src/main/res/drawable-xxxhdpi/edirne_launcher_foreground.webp
          test -s app/src/main/res/drawable-nodpi/edirne_launcher_foreground_legacy.webp
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: gradle assembleRelease --stacktrace
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdirneHavaDurumu-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2}' app/build.gradle)
          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk#EdirneHavaDurumu.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release/app-release.apk#EdirneHavaDurumu.apk --title "Edirne Hava Durumu $VERSION_NAME" --notes "EDİRNE YEREL HAVA TAHMİN UYGULAMASI"
          fi
      - name: Update website version data
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          VERSION_NAME=$(awk -F"'" '/versionName/{print $2}' app/build.gradle)
          VERSION_CODE=$(awk '/versionCode/{print $2}' app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk docs/EdirneHavaDurumu.apk
          UPLOAD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf '{"versionCode":%s,"versionName":"%s","uploadDate":"%s","notes":"Yeni APK yayinlandi.","apkUrl":"https://github.com/hkndmrl22-bit/Edirnehavadurumu2/releases/latest/download/app-release.apk"}\n' "$VERSION_CODE" "$VERSION_NAME" "$UPLOAD_DATE" > docs/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EdirneHavaDurumu.apk docs/version.json
          git diff --cached --quiet || git commit -m "Site surum bilgisini guncelle [skip ci]"
          git push
