plugins { id 'com.android.application' }

android {
    namespace 'com.edirnehavadurumu.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edirnehavadurumu.app'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '10.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
}
