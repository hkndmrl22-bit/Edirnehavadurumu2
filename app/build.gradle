plugins { id 'com.android.application' }

android {
    namespace 'com.edirnehavadurumu.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.edirnehavadurumu.app'
        minSdk 23
        targetSdk 35
        versionCode 89
        versionName '10.79'
    }

    signingConfigs {
        release {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'androiddebugkey'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}


